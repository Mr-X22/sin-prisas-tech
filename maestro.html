<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel del Maestro · Sin Prisas Tech</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac', 
                            400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 
                            800: '#166534', 900: '#14532d',
                        },
                        sage: { 50: '#f4f7f4', 100: '#e3eae3', 200: '#c7d6c8' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .focus-accessible:focus { outline: 3px solid #16a34a; outline-offset: 2px; }
        .tab-active { background-color: #15803d; color: white; }
        .tab-inactive { color: #475569; }
        .tab-inactive:hover { background-color: #f0fdf4; color: #15803d; }
        /* Scrollbar styling for tables */
        .custom-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-sage-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header Principal -->
    <header class="bg-white border-b border-brand-100 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-brand-600 text-white p-2 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold font-heading text-slate-900 leading-none">Panel del Maestro</h1>
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wide mt-0.5">Sin Prisas Tech</p>
                </div>
            </div>
            <div id="headerAuth" class="hidden items-center gap-3">
                <div class="text-right hidden sm:block">
                    <p id="maestroName" class="text-sm font-bold text-slate-800"></p>
                    <p id="maestroRole" class="text-xs text-brand-600 font-medium"></p>
                </div>
                <button onclick="logout()" class="p-2 text-slate-400 hover:text-red-600 transition rounded-lg hover:bg-red-50" title="Cerrar sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal de la App -->
    <main id="app" class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6"></main>

<script>
// --- CONFIGURACIÓN ---
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzt5zUJxAh7vLOG-COJv_bUN7za2Xm49g62jJ8Xt0NWh6jlJVF481MtPHswd9RRFX2d/exec";
const CURSOS = {pc1:"Mi primera computadora",ph1:"Mi celular paso a paso",web1:"Internet sin miedo",fo1:"Mis fotografías",w1:"Word paso a paso",x1:"Excel para empezar",pp1:"PowerPoint creativo",wv:"Word para la vida real",pv:"PowerPoint para la vida real",xi:"Excel intermedio"};

// --- ESTADO DE LA APLICACIÓN ---
let estado = {
    clave: localStorage.getItem('spt_maestro_key') || '',
    vistaActual: 'login', // login, cargando, resumen, clases, alumnos, comprobantes, dudas
    datos: null,
    error: null
};

// --- REFERENCIAS AL DOM ---
const elApp = document.getElementById('app');
const elHeaderAuth = document.getElementById('headerAuth');
const elMaestroName = document.getElementById('maestroName');
const elMaestroRole = document.getElementById('maestroRole');

// --- UTILIDADES ---
function formatearFecha(fechaStr) {
    if(!fechaStr) return '-';
    const d = new Date(fechaStr + "T00:00:00");
    if(isNaN(d)) return fechaStr;
    return d.toLocaleDateString("es-MX", {day:"numeric", month:"short", year:"numeric"});
}
function dinero(n) { return "$" + Number(n).toLocaleString("es-MX"); }

// --- COMUNICACIÓN CON EL SERVIDOR ---
async function api(payload) {
    if(estado.clave) payload.k = estado.clave;
    try {
        const req = await fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(payload) });
        const res = await req.json();
        return res;
    } catch(e) {
        return { error: 'Error de conexión. Intenta de nuevo.' };
    }
}

// --- FUNCIONES DE NAVEGACIÓN Y SESIÓN ---
async function iniciarSesion(clave) {
    estado.error = null;
    estado.vistaActual = 'cargando';
    render();
    
    const res = await api({ tipo: 'admin_listar', m: '' }); // Para simplificar, intentamos login global
    
    if (res.error) {
        estado.error = res.error === 'clave' ? 'Clave incorrecta.' : res.error;
        estado.clave = '';
        localStorage.removeItem('spt_maestro_key');
        estado.vistaActual = 'login';
    } else {
        estado.clave = clave;
        localStorage.setItem('spt_maestro_key', clave);
        estado.datos = res;
        estado.vistaActual = 'resumen';
        
        // Update header
        elHeaderAuth.classList.remove('hidden');
        elHeaderAuth.classList.add('flex');
        elMaestroName.innerText = res.nombre || 'Administrador';
        elMaestroRole.innerText = res.rol === 'superior' ? 'Acceso Total' : 'Maestro';
    }
    render();
}

function logout() {
    estado.clave = '';
    estado.datos = null;
    localStorage.removeItem('spt_maestro_key');
    elHeaderAuth.classList.add('hidden');
    elHeaderAuth.classList.remove('flex');
    estado.vistaActual = 'login';
    render();
}

function cambiarVista(vista) {
    estado.vistaActual = vista;
    render();
}

function render() {
    let html = '';
    
    if (estado.vistaActual === 'login') {
        html = renderLogin();
    } else if (estado.vistaActual === 'cargando') {
        html = renderCargando();
    } else {
        html = `
            <div class="flex flex-col lg:flex-row gap-6">
                <aside class="w-full lg:w-64 flex-shrink-0">
                    ${renderSidebar()}
                </aside>
                <div class="flex-1 min-w-0">
                    ${renderContenidoPrincipal()}
                </div>
            </div>
        `;
    }
    
    elApp.innerHTML = html;
}

// --- VISTAS INDIVIDUALES ---
function renderLogin() {
    return `
        <div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-2xl border border-brand-100 shadow-sm text-center">
            <div class="w-16 h-16 bg-brand-50 text-brand-600 rounded-full flex items-center justify-center mx-auto text-3xl mb-4">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-extrabold font-heading text-slate-900 mb-2">Acceso al Panel</h2>
            <p class="text-slate-500 mb-6 text-sm">Ingresa tu clave de maestro para continuar.</p>
            
            ${estado.error ? `<div class="bg-red-50 text-red-600 p-3 rounded-xl mb-4 text-sm font-bold border border-red-100"><i class="fa-solid fa-triangle-exclamation mr-2"></i>${estado.error}</div>` : ''}
            
            <form onsubmit="event.preventDefault(); iniciarSesion(document.getElementById('inClave').value);" class="space-y-4 text-left">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Clave de acceso</label>
                    <input type="password" id="inClave" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus-accessible text-center text-lg tracking-widest font-mono" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-sm">
                    Entrar al panel
                </button>
            </form>
        </div>
    `;
}

function renderCargando() {
    return `
        <div class="flex flex-col items-center justify-center py-20 text-brand-600">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4"></i>
            <p class="font-bold text-slate-600 animate-pulse">Cargando información...</p>
        </div>
    `;
}

function renderSidebar() {
    const v = estado.vistaActual;
    const btnClass = (isActive) => `w-full text-left flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition ${isActive ? 'tab-active shadow-sm' : 'tab-inactive'}`;
    
    // Contadores para notificaciones (ejemplo)
    const dudasPendientes = (estado.datos.users || []).reduce((acc, u) => acc + u.d.filter(d => !d.a).length, 0);
    const compsPendientes = (estado.datos.comprobantes || []).filter(c => c.estado === 'pendiente').length;

    return `
        <div class="bg-white p-3 rounded-2xl border border-brand-100 shadow-sm space-y-1 sticky top-24">
            <button onclick="cambiarVista('resumen')" class="${btnClass(v === 'resumen')}">
                <i class="fa-solid fa-chart-pie w-5 text-center"></i> <span>Resumen general</span>
            </button>
            <button onclick="cambiarVista('clases')" class="${btnClass(v === 'clases')}">
                <i class="fa-solid fa-video w-5 text-center"></i> <span>Clases en vivo</span>
            </button>
            <button onclick="cambiarVista('alumnos')" class="${btnClass(v === 'alumnos')}">
                <i class="fa-solid fa-users w-5 text-center"></i> <span>Alumnos inscritos</span>
            </button>
            <button onclick="cambiarVista('dudas')" class="${btnClass(v === 'dudas')}">
                <i class="fa-solid fa-circle-question w-5 text-center"></i> <span>Dudas de clase</span>
                ${dudasPendientes ? `<span class="ml-auto bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full">${dudasPendientes}</span>` : ''}
            </button>
            ${estado.datos.rol === 'superior' ? `
            <button onclick="cambiarVista('comprobantes')" class="${btnClass(v === 'comprobantes')}">
                <i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i> <span>Comprobantes</span>
                ${compsPendientes ? `<span class="ml-auto bg-amber-500 text-white text-[10px] px-2 py-0.5 rounded-full">${compsPendientes}</span>` : ''}
            </button>
            ` : ''}
        </div>
    `;
}

function renderContenidoPrincipal() {
    switch(estado.vistaActual) {
        case 'resumen': return renderVistaResumen();
        case 'clases': return renderVistaClases();
        case 'alumnos': return renderVistaAlumnos();
        case 'dudas': return renderVistaDudas();
        case 'comprobantes': return estado.datos.rol === 'superior' ? renderVistaComprobantes() : '';
        default: return '';
    }
}

function renderVistaResumen() {
    const d = estado.datos;
    const alumnosTotal = d.users ? d.users.length : 0;
    const clasesActivas = d.clases ? d.clases.filter(c => !c.cerrada).length : 0;
    
    return `
        <div class="space-y-6">
            <h2 class="text-2xl font-extrabold font-heading text-slate-900">Hola, ${d.nombre || 'Administrador'} 👋</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-2xl border border-brand-100 shadow-sm flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-users"></i>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Alumnos</p>
                        <p class="text-2xl font-extrabold text-slate-800">${alumnosTotal}</p>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-brand-100 shadow-sm flex items-center gap-4">
                    <div class="w-12 h-12 bg-brand-50 text-brand-600 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-video"></i>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Clases Activas</p>
                        <p class="text-2xl font-extrabold text-slate-800">${clasesActivas}</p>
                    </div>
                </div>
                ${d.rol === 'superior' ? `
                <div class="bg-white p-5 rounded-2xl border border-brand-100 shadow-sm flex items-center gap-4">
                    <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-sack-dollar"></i>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Recaudado</p>
                        <p class="text-2xl font-extrabold text-slate-800">${dinero(d.recaudado || 0)}</p>
                    </div>
                </div>
                ` : ''}
            </div>

            <div class="bg-brand-50 border border-brand-200 rounded-2xl p-6 text-center">
                <i class="fa-solid fa-seedling text-3xl text-brand-500 mb-3"></i>
                <h3 class="font-bold text-slate-800 text-lg">Todo listo para enseñar</h3>
                <p class="text-slate-600 text-sm mt-1">Usa el menú lateral para gestionar tus clases, responder dudas o revisar el progreso de los alumnos.</p>
            </div>
        </div>
    `;
}

function renderVistaClases() {
    const clases = estado.datos.clases || [];
    
    let html = `
        <div class="space-y-6">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <h2 class="text-2xl font-extrabold font-heading text-slate-900">Clases Programadas</h2>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    `;

    if(clases.length === 0) {
        html += `<p class="col-span-full text-center text-slate-500 py-8 bg-white rounded-2xl border border-slate-200">No hay clases programadas actualmente.</p>`;
    }

    clases.forEach(c => {
        const nombreCurso = CURSOS[c.curso] || c.curso;
        const estadoBadge = c.cerrada 
            ? `<span class="bg-red-100 text-red-700 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide">Cerrada</span>`
            : `<span class="bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide">Abierta</span>`;
            
        html += `
            <div class="bg-white border border-brand-100 rounded-2xl p-5 shadow-sm hover:shadow-md transition">
                <div class="flex justify-between items-start mb-3">
                    <span class="text-xs font-bold text-brand-600 bg-brand-50 px-2 py-1 rounded-md">${nombreCurso}</span>
                    ${estadoBadge}
                </div>
                <h3 class="font-bold text-lg text-slate-800 leading-tight mb-2">${c.n}</h3>
                <p class="text-sm text-slate-500 mb-4"><i class="fa-regular fa-calendar-days mr-2"></i>${c.cuando}</p>
                
                <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100 mb-4">
                    <div class="text-center w-1/2 border-r border-slate-200">
                        <p class="text-xs text-slate-400 font-bold uppercase">Inscritos</p>
                        <p class="font-bold text-slate-800">${c.res} <span class="text-slate-400 text-sm font-normal">/ ${c.cupo}</span></p>
                    </div>
                    <div class="text-center w-1/2">
                        <p class="text-xs text-slate-400 font-bold uppercase">Enlace enviado</p>
                        <p class="font-bold ${c.enviado ? 'text-emerald-600' : 'text-slate-400'}">${c.enviado ? '<i class="fa-solid fa-check"></i> Sí' : 'No'}</p>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button onclick="toggleClase('${c.id}', ${!c.cerrada})" class="flex-1 py-2 px-3 rounded-lg font-bold text-sm border transition ${c.cerrada ? 'border-brand-600 text-brand-600 hover:bg-brand-50' : 'bg-red-50 text-red-600 border-red-200 hover:bg-red-100'}">
                        ${c.cerrada ? '<i class="fa-solid fa-lock-open mr-1"></i> Abrir' : '<i class="fa-solid fa-lock mr-1"></i> Cerrar'}
                    </button>
                    ${c.url ? `
                    <a href="${c.url}" target="_blank" class="flex-1 text-center py-2 px-3 bg-brand-600 hover:bg-brand-700 text-white rounded-lg font-bold text-sm transition">
                        <i class="fa-solid fa-video mr-1"></i> Entrar
                    </a>
                    ` : `<button disabled class="flex-1 py-2 px-3 bg-slate-100 text-slate-400 rounded-lg font-bold text-sm cursor-not-allowed">Sin enlace</button>`}
                </div>
            </div>
        `;
    });

    html += `</div></div>`;
    return html;
}

async function toggleClase(id, cerrar) {
    const orig = estado.vistaActual;
    estado.vistaActual = 'cargando'; render();
    const res = await api({ tipo: 'admin_clase_cerrar', id: id, cerrar: cerrar });
    if(res.ok) {
        // Recargar datos
        const lista = await api({ tipo: 'admin_listar', m: '' });
        if(!lista.error) estado.datos = lista;
    } else {
        alert("Error: " + (res.error || "Desconocido"));
    }
    estado.vistaActual = orig; render();
}

function renderVistaAlumnos() {
    const users = estado.datos.users || [];
    
    let html = `
        <div class="space-y-6">
            <h2 class="text-2xl font-extrabold font-heading text-slate-900">Alumnos e Inscripciones</h2>
            
            <div class="bg-white border border-brand-100 rounded-2xl shadow-sm overflow-hidden custom-scroll">
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead>
                        <tr class="bg-slate-50 border-b border-brand-100 text-xs uppercase tracking-wider text-slate-500 font-bold">
                            <th class="p-4">Alumno</th>
                            <th class="p-4">Cursos Activos</th>
                            <th class="p-4">Avance General</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-brand-50 text-sm">
    `;

    if(users.length === 0) {
        html += `<tr><td colspan="3" class="p-6 text-center text-slate-500">No hay alumnos para mostrar.</td></tr>`;
    }

    users.forEach(u => {
        // Encontrar inscripciones activas
        const insActivas = (u.ins || []).filter(i => i.acceso).map(i => CURSOS[i.c] || i.c).join(", ");
        
        // Calcular un avance rápido simplificado
        let clasesCompletadas = 0;
        Object.values(u.p || {}).forEach(arr => { clasesCompletadas += (arr ? arr.length : 0); });

        html += `
            <tr class="hover:bg-slate-50 transition">
                <td class="p-4">
                    <p class="font-bold text-slate-800">${u.n}</p>
                    <p class="text-xs text-slate-500">${u.e}</p>
                    <p class="text-[10px] text-slate-400 mt-1">Registrado: ${formatearFecha(u.f)}</p>
                </td>
                <td class="p-4 text-brand-700 font-medium">
                    ${insActivas || '<span class="text-slate-400 italic font-normal">Ninguno activo</span>'}
                </td>
                <td class="p-4">
                    <span class="bg-blue-50 text-blue-700 px-3 py-1 rounded-full font-bold text-xs border border-blue-100">
                        ${clasesCompletadas} clases completadas
                    </span>
                </td>
            </tr>
        `;
    });

    html += `</tbody></table></div></div>`;
    return html;
}

function renderVistaDudas() {
    const users = estado.datos.users || [];
    let dudas = [];
    
    users.forEach(u => {
        if(u.d) {
            u.d.forEach(duda => {
                dudas.push({
                    ...duda,
                    alumnoNombre: u.n,
                    alumnoCorreo: u.e
                });
            });
        }
    });

    // Ordenar: primero las no respondidas, luego por fecha
    dudas.sort((a, b) => {
        if(!a.a && b.a) return -1;
        if(a.a && !b.a) return 1;
        return a.f < b.f ? 1 : -1;
    });

    let html = `
        <div class="space-y-6">
            <h2 class="text-2xl font-extrabold font-heading text-slate-900">Dudas de los Alumnos</h2>
            <div class="space-y-4">
    `;

    if(dudas.length === 0) {
        html += `<p class="text-center text-slate-500 py-8 bg-white rounded-2xl border border-slate-200">No hay dudas registradas.</p>`;
    }

    dudas.forEach(d => {
        const nombreCurso = CURSOS[d.c] || d.c;
        const respondida = !!d.a;
        
        html += `
            <div class="bg-white border ${respondida ? 'border-slate-200' : 'border-amber-300 shadow-md'} rounded-2xl p-5">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <span class="text-xs font-bold text-brand-600 bg-brand-50 px-2 py-1 rounded-md mr-2">${nombreCurso}</span>
                        <span class="text-xs text-slate-500">Clase ${d.l || '?'}</span>
                    </div>
                    <span class="text-[10px] text-slate-400 font-bold">${formatearFecha(d.f)}</span>
                </div>
                
                <p class="font-bold text-slate-800 text-sm mb-1">${d.alumnoNombre} <span class="text-slate-400 font-normal">preguntó:</span></p>
                <div class="bg-slate-50 p-4 rounded-xl text-slate-700 italic border border-slate-100 mb-4">
                    "${d.q}"
                </div>
                
                ${respondida ? `
                    <p class="font-bold text-brand-700 text-sm mb-1">Tu respuesta:</p>
                    <div class="bg-brand-50 p-4 rounded-xl text-brand-800 border border-brand-100">
                        ${d.a}
                    </div>
                ` : `
                    <div class="mt-4">
                        <textarea id="resp_${d.id}" rows="3" placeholder="Escribe tu respuesta aquí..." class="w-full p-3 bg-white border border-slate-300 rounded-xl focus-accessible text-sm mb-2"></textarea>
                        <div class="text-right">
                            <button onclick="responderDuda('${d.id}')" class="bg-brand-600 hover:bg-brand-700 text-white font-bold py-2 px-5 rounded-xl text-sm transition">
                                Enviar respuesta
                            </button>
                        </div>
                    </div>
                `}
            </div>
        `;
    });

    html += `</div></div>`;
    return html;
}

async function responderDuda(idDuda) {
    const elText = document.getElementById('resp_' + idDuda);
    const respuesta = elText.value.trim();
    if(!respuesta) { alert("Escribe una respuesta."); return; }
    
    elText.disabled = true;
    const orig = estado.vistaActual;
    const res = await api({ tipo: 'admin_responder', id: idDuda, a: respuesta });
    
    if(res.ok) {
        // Refresh
        const lista = await api({ tipo: 'admin_listar', m: '' });
        if(!lista.error) estado.datos = lista;
        cambiarVista(orig);
    } else {
        alert("Error al responder: " + (res.error || "Desconocido"));
        elText.disabled = false;
    }
}

function renderVistaComprobantes() {
    const comps = estado.datos.comprobantes || [];
    
    let html = `
        <div class="space-y-6">
            <h2 class="text-2xl font-extrabold font-heading text-slate-900">Validación de Pagos</h2>
            
            <div class="grid grid-cols-1 gap-4">
    `;

    const pendientes = comps.filter(c => c.estado === 'pendiente');
    const procesados = comps.filter(c => c.estado !== 'pendiente').slice(0, 20); // Mostrar últimos 20

    if(pendientes.length === 0) {
        html += `
            <div class="bg-emerald-50 border border-emerald-200 p-6 rounded-2xl text-center text-emerald-700">
                <i class="fa-solid fa-check-circle text-3xl mb-2"></i>
                <p class="font-bold">Todo al día.</p>
                <p class="text-sm">No hay comprobantes pendientes de revisión.</p>
            </div>
        `;
    }

    pendientes.forEach(c => {
        const nombreCurso = CURSOS[c.c] || c.c;
        html += `
            <div class="bg-white border border-amber-300 shadow-md rounded-2xl p-5 flex flex-col md:flex-row gap-6 items-start">
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide">Pendiente</span>
                        <span class="text-xs text-slate-500 font-bold">${formatearFecha(c.f)}</span>
                    </div>
                    <p class="font-bold text-lg text-slate-800">${c.n} <span class="text-sm font-normal text-slate-500">(${c.e})</span></p>
                    <p class="text-brand-600 font-bold text-sm mb-3">${nombreCurso} <span class="text-slate-400 font-normal ml-2">Pago ${c.pagadas + 1} de ${c.max}</span></p>
                    
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 inline-block mb-4">
                        <p class="text-xs text-slate-500 uppercase font-bold">Monto esperado</p>
                        <p class="text-xl font-extrabold text-slate-800">${dinero(c.debe)}</p>
                    </div>
                    
                    <div class="flex flex-wrap gap-2 mt-auto">
                        <button onclick="verComprobante('${c.id}')" class="py-2 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm transition">
                            <i class="fa-solid fa-eye mr-1"></i> Ver Imagen
                        </button>
                        <button onclick="aprobarComprobante('${c.id}', ${c.debe})" class="py-2 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm transition">
                            <i class="fa-solid fa-check mr-1"></i> Aprobar
                        </button>
                        <button onclick="rechazarComprobante('${c.id}')" class="py-2 px-4 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 font-bold rounded-xl text-sm transition">
                            <i class="fa-solid fa-xmark mr-1"></i> Rechazar
                        </button>
                    </div>
                </div>
                <div id="img_viewer_${c.id}" class="w-full md:w-64 h-48 bg-slate-100 rounded-xl border border-slate-200 flex items-center justify-center text-slate-400 overflow-hidden">
                    <p class="text-xs">Clic en "Ver Imagen" para cargar</p>
                </div>
            </div>
        `;
    });

    if (procesados.length > 0) {
        html += `<h3 class="text-lg font-bold text-slate-800 mt-6 mb-2">Últimos procesados</h3>
        <div class="bg-white border border-brand-100 rounded-2xl shadow-sm overflow-hidden custom-scroll">
            <table class="w-full text-left border-collapse text-sm">
                <thead class="bg-slate-50 text-xs text-slate-500 uppercase">
                    <tr><th class="p-3 border-b">Alumno</th><th class="p-3 border-b">Curso</th><th class="p-3 border-b">Estado</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
        `;
        procesados.forEach(c => {
            const estadoColor = c.estado === 'aprobado' ? 'text-emerald-600 bg-emerald-50' : 'text-red-600 bg-red-50';
            html += `
                <tr>
                    <td class="p-3 font-medium">${c.n}</td>
                    <td class="p-3 text-slate-500">${CURSOS[c.c] || c.c}</td>
                    <td class="p-3"><span class="px-2 py-1 rounded-md text-xs font-bold ${estadoColor}">${c.estado}</span></td>
                </tr>
            `;
        });
        html += `</tbody></table></div>`;
    }

    html += `</div></div>`;
    return html;
}

// Funciones para Comprobantes
async function verComprobante(id) {
    const viewer = document.getElementById('img_viewer_' + id);
    viewer.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-2xl text-brand-600"></i>';
    const res = await api({ tipo: 'admin_comprobante_ver', id: id });
    if(res.img) {
        viewer.innerHTML = `<img src="${res.img}" class="w-full h-full object-contain cursor-pointer" onclick="window.open('${res.link}', '_blank')">`;
    } else {
        viewer.innerHTML = `<p class="text-red-500 text-xs px-4 text-center">No se pudo cargar. <a href="${res.link || '#'}" target="_blank" class="underline">Ver en Drive</a></p>`;
    }
}

async function aprobarComprobante(id, monto) {
    if(!confirm(`¿Seguro que deseas APROBAR este pago por ${dinero(monto)}?`)) return;
    const orig = estado.vistaActual;
    estado.vistaActual = 'cargando'; render();
    const res = await api({ tipo: 'admin_comprobante_aprobar', id: id, monto: monto });
    if(res.ok) {
        const lista = await api({ tipo: 'admin_listar', m: '' });
        if(!lista.error) estado.datos = lista;
    } else alert("Error: " + (res.error || "Desconocido"));
    cambiarVista(orig);
}

async function rechazarComprobante(id) {
    const nota = prompt("Motivo del rechazo (se enviará al alumno):", "La imagen no es clara o no coincide con el monto esperado.");
    if(nota === null) return;
    const orig = estado.vistaActual;
    estado.vistaActual = 'cargando'; render();
    const res = await api({ tipo: 'admin_comprobante_rechazar', id: id, nota: nota });
    if(res.ok) {
        const lista = await api({ tipo: 'admin_listar', m: '' });
        if(!lista.error) estado.datos = lista;
    } else alert("Error: " + (res.error || "Desconocido"));
    cambiarVista(orig);
}

// --- INICIALIZACIÓN ---
window.onload = () => {
    if (estado.clave) {
        iniciarSesion(estado.clave);
    } else {
        render();
    }
};
</script>
