<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<title>Panel del maestro · Sin Prisas Tech</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Inter","Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.5}
main{max-width:1320px;margin:auto;padding:0 16px 60px}
h1{font-size:28px;margin:0;letter-spacing:-.01em}.mb{display:flex;align-items:center;gap:14px}.mb img{width:64px;height:auto;background:#fff;border-radius:12px;padding:2px}.mb small{display:block;color:var(--muted)}h2{font-size:21px;margin:26px 0 8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;padding:11px 16px;font:inherit;font-weight:bold;color:var(--muted);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--muted)}.stat b{display:block;font-size:34px;color:var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
label{display:block;font-weight:bold;font-size:15px;margin-bottom:10px}
input,textarea,select{display:block;width:100%;margin-top:4px;padding:11px 12px;font:inherit;font-weight:normal;color:var(--ink);background:var(--cream);border:2px solid var(--line);border-radius:9px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.btn,.btn2,.danger,.ghost{font:inherit;font-weight:bold;border-radius:9px;padding:10px 16px;cursor:pointer}
.btn{border:0;background:var(--blue);color:var(--onblue)}.btn2{border:1px solid var(--blue);background:var(--paper);color:var(--blue)}
.danger{border:1px solid var(--bad);background:var(--paper);color:var(--bad)}.ghost{border:1px solid var(--line);background:var(--paper);color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
td .btn,td .ghost,td .danger{padding:7px 12px;font-size:.86em}td:last-child{min-width:250px}td .row{gap:6px}
.scroll{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--blue2);color:var(--ink)}
.ok{background:var(--tip);border-left:5px solid var(--green);padding:10px 14px;border-radius:7px}
.err{color:var(--bad);font-weight:bold;min-height:1.3em}
.tip{background:var(--tip);border-left:5px solid #e5a93d;padding:12px 16px;border-radius:7px;margin:12px 0}
.chip{display:inline-block;padding:2px 12px;border-radius:99px;background:var(--blue2);font-size:.82em;font-weight:700}.hint{color:var(--muted);margin:4px 0 10px;font-size:.9em}textarea{line-height:1.5}
summary{cursor:pointer;font-weight:bold;color:var(--blue)}small{color:var(--muted)}
.chk{display:inline-flex;gap:6px;align-items:center;margin:4px 14px 4px 0;font-weight:normal}.chk input{width:auto;margin:0}details.gr{margin:12px 0}details.gr>summary{cursor:pointer;font-weight:700;padding:8px 0}.clave{font-size:1.5em;font-weight:800;letter-spacing:2px;background:#fff;color:#222;padding:8px 14px;border-radius:8px;display:inline-block;margin:6px 0}
/* ---- v10: misma estética verde que la página de los alumnos ---- */
:root{--ink:#0f172a;--muted:#475569;--blue:#15803d;--onblue:#fff;--blue2:#f0fdf4;--cream:#f4f7f4;--paper:#fff;--line:#d3e8d9;--green:#166534;--tip:#fef3c7;--bad:#b3261e;color-scheme:light}
h1,h2,h3,.hd .ttl{font-family:"Outfit","Inter",system-ui,sans-serif;letter-spacing:-.01em}
.stat{display:flex;align-items:center;gap:14px}.stat .si{flex:none;width:2.8em;height:2.8em;border-radius:14px;background:var(--blue2);display:grid;place-items:center;font-size:1.15em}.stat small{display:block;font-size:.78em;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.stat b{font-family:"Outfit",sans-serif;font-size:28px}
.card,.stat,.scroll{box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card{border-radius:20px}
.bicon{background:var(--blue);color:var(--onblue);border-radius:16px;padding:11px;display:grid;place-items:center}.bicon svg{width:24px;height:24px}.hd .ttl{font-size:24px;font-weight:800;color:var(--ink)}.hd .ttl em{font-style:normal;color:var(--blue)}
.tcard{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-radius:24px;padding:22px}.tcard .btn{margin-left:auto}.tname{margin:0;font-size:24px}
.tav{width:4em;height:4em;border-radius:18px;background:var(--blue);color:var(--onblue);display:grid;place-items:center;font-family:"Outfit",sans-serif;font-weight:800;font-size:1.1em}.tav.sm{width:2.4em;height:2.4em;border-radius:50%;background:#dcfce7;color:#166534;font-size:.8em;flex:none}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:0 0 18px}
.two8{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}@media(max-width:900px){.two8{grid-template-columns:1fr}}
.duda{background:var(--blue2);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.dq{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}.crow small{display:block;color:var(--muted)}
.chip.amber{background:#fef3c7;color:#92400e}.stat.amber b{color:#b45309}
.link{border:0;background:none;color:var(--blue);font:inherit;font-weight:700;cursor:pointer;padding:6px 0;text-decoration:underline}
.rolchip{display:inline-block;background:#dcfce7;color:#166534;font-weight:700;font-size:.75em;border-radius:99px;padding:.15em .8em;margin-left:6px}
:root[data-tema="azul"]{--ink:#0c2a52;--muted:#485d78;--blue:#1857b8;--blue2:#e7f0fc;--cream:#f4f8fd;--line:#d3e1f2;--green:#1f6b45}
:root[data-tema="oscuro"]{color-scheme:dark;--ink:#eaf1fb;--muted:#b5c5dc;--blue:#7db4ff;--onblue:#06142b;--blue2:#1a2b47;--cream:#0b1424;--paper:#132038;--line:#2b4065;--green:#7ccf9f;--tip:#3d2d10;--bad:#f2b8b5}
:root[data-tema="cafe"]{--ink:#12283d;--muted:#46596b;--blue:#b84708;--blue2:#fdf0e1;--cream:#fffaf4;--line:#ebdac6}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;padding:10px 18px;margin:0 0 18px;box-shadow:0 2px 10px rgba(12,42,82,.06)}
.hd .ttl{font-size:20px;color:var(--blue)}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.side{position:sticky;top:12px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:10px}
.side h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px}.side h3:first-child{margin-top:4px}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;font:inherit;font-weight:700;color:var(--ink);padding:10px 12px;border-radius:12px;cursor:pointer}
.nv:hover{background:var(--blue2)}.nv.on{background:var(--blue);color:var(--onblue)}
.nv .n{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px;min-width:22px;text-align:center}
.phead{margin:2px 0 14px}.phead h1{font-size:28px}.phead p{color:var(--muted);margin:4px 0 0}
h2.sec{font-size:15px;margin:20px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card h3{margin:0 0 6px;font-size:19px}
.lnk{cursor:pointer;text-align:left;font:inherit;width:100%}.lnk:hover{border-color:var(--blue)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.pill{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:700;padding:8px 14px;border-radius:99px;cursor:pointer}
.pill.on{background:var(--blue);color:var(--onblue);border-color:var(--blue)}
details.cl{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--paper)}
details.cl>summary{padding:10px 14px;font-weight:400;color:var(--ink)}
details.cl>.card{border:0;border-top:1px solid var(--line);border-radius:0 0 12px 12px;margin:0}
tr.cancelado td{opacity:.55}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;display:flex;overflow-x:auto;gap:4px;padding:8px}.side h3{display:none}.nv{width:auto;white-space:nowrap}}
</style>
