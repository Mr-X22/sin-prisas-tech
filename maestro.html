<style>

*{box-sizing:border-box}

label{display:block;font-weight:bold;font-size:15px;margin-bottom:10px}

.btn{border:0;background:var(--blue);color:var(--onblue)}.btn2{border:1px solid var(--blue);background:var(--paper);color:var(--blue)}

.hd .ttl{font-size:20px;color:var(--blue)}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.side{position:sticky;top:12px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:10px}

.phead{margin:2px 0 14px}.phead h1{font-size:28px}.phead p{color:var(--muted);margin:4px 0 0}

.card h3{margin:0 0 6px;font-size:19px}
.lnk{cursor:pointer;text-align:left;font:inherit;width:100%}.lnk:hover{border-color:var(--blue)}

details.cl{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--paper)}

.blogo{height:46px;width:auto;display:block;border-radius:8px;background:#fff;padding:2px}
</style>

function todosPagos(){return D.ins.flatMap(i=>(i.pagos||[]).map((p,k)=>({...p,n:i.n,e:i.e,c:i.c,mod:i.mod,k,max:i.max}))).sort((a,b)=>a.f<b.f?1:a.f>b.f?-1:0)}
function libro(){const L=todosPagos();if(!L.length)return"";const mes={};L.forEach(p=>{const m=p.f.slice(0,7);mes[m]=(mes[m]||0)+p.monto});
return `<h2 style="margin-top:28px">Libro de pagos</h2><div class="row"><button class="btn2" onclick="csvPagos()">Descargar libro de pagos (CSV)</button></div><div class="grid">${Object.keys(mes).sort().reverse().slice(0,6).map(m=>`<div class="stat"><b>${dinero(mes[m])}</b>${new Date(m+"-01T00:00:00").toLocaleDateString("es-MX",{month:"long",year:"numeric"})}</div>`).join("")}</div><div class="scroll" style="margin-top:12px"><table><thead><tr><th>Fecha</th><th>Alumno</th><th>Curso</th><th>Concepto</th><th>Monto</th><th>Folio</th></tr></thead><tbody>${L.map(p=>`<tr><td>${esc(p.f)}</td><td>${esc(p.n)}<br><small>${esc(p.e)}</small></td><td>${esc(CURSOS[p.c]||p.c)}</td><td>${p.mod==="unico"?"Pago único":"Mensualidad "+(p.k+1)+" de "+p.max}${p.nota?`<br><small>${esc(p.nota)}</small>`:""}</td><td>${dinero(p.monto)}</td><td><small>${esc(p.folio||"")}</small></td></tr>`).join("")}</tbody></table></div>`}
function csvPagos(){const qq=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[["fecha","alumno","correo","curso","concepto","monto","nota","folio"],...todosPagos().map(p=>[p.f,p.n,p.e,CURSOS[p.c]||p.c,p.mod==="unico"?"Pago único":"Mensualidad "+(p.k+1)+" de "+p.max,p.monto,p.nota||"",p.folio||""])],a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(qq).join(",")).join("\n")],{type:"text/csv"}));a.download="libro-de-pagos-sin-prisas-tech.csv";a.click()}
async function pagar(id){const r=await acc("admin_pago",{id});if(r&&r.ok){await cargar();const i=D.ins.find(x=>x.id===id)||{};msg=`✓ Pago registrado. Su acceso llega hasta el ${i.hasta?fechaLarga(i.hasta):"—"}.`}else msg="No se pudo registrar el pago. "+(r&&r.error==="completo"?"Esa inscripción ya está pagada por completo.":motivo(r));pintar()}
async function deshacerPago(id){if(conf!=="d"+id){conf="d"+id;pintar();return}conf="";const r=await acc("admin_pago_deshacer",{id});await cargar();msg=r&&r.ok?"Último pago deshecho.":"No se pudo deshacer. "+motivo(r);pintar()}
async function cancelarIns(id){if(conf!=="c"+id){conf="c"+id;pintar();return}conf="";const r=await acc("admin_inscripcion_cancelar",{id});await cargar();msg=r&&r.ok?"Inscripción cancelada.":"No se pudo cancelar. "+motivo(r);pintar()}
async function responder(id,i){const t=document.getElementById("r"+i).value.trim();if(!t)return;const r=await acc("admin_responder",{id,a:t});if(r&&r.ok){await cargar();msg=REAL?"✓ Respuesta enviada. El alumno la recibe por correo y la ve en su clase.":"✓ Respuesta guardada."}else msg="No se pudo enviar la respuesta. "+motivo(r);pintar()}
function nuevaClase(){D.clases.push({id:"",n:"",cuando:"",fecha:"",hora:"",cupo:8,url:"",curso:CS,cerrada:false,res:0,ins:[]});pintar();setTimeout(()=>{const e=document.querySelector("details.cl[open]");if(e)e.scrollIntoView({block:"center"})},0)}
async function guardar(i,callado){const g=x=>document.getElementById(x+i).value.trim(),c={id:D.clases[i].id||"",curso:g("cs"),n:g("cn"),cuando:g("cw"),cupo:Number(g("cc"))||0,url:g("cu"),fecha:g("cf"),hora:g("ch")};
if(c.fecha&&!c.cuando)c.cuando=textoCuando(c.fecha,c.hora);
if(c.hora&&!c.fecha){msg="Para poner la hora, elige también la fecha.";pintar();return null}
if(!c.cuando){msg="Escribe cuándo será la clase (o elige la fecha y la hora).";pintar();return null}
if(!c.curso){msg="Elige el curso que se impartirá en esta clase.";pintar();return null}
if(!c.n)c.n=CURSOS[c.curso]||"Clase en vivo";
if(c.url&&!/^https?:\/\//i.test(c.url)){msg="El enlace debe empezar con https://";pintar();return null}
const r=await acc("admin_clase_guardar",{clase:c});if(!r||!r.ok){msg="No se pudo guardar. "+motivo(r);pintar();return null}
await cargar();if(!callado){msg=r.enviados?`✓ Clase guardada. El cupo ya estaba cerrado, así que se envió el enlace a ${r.enviados} inscritos.`:"✓ Clase guardada.";pintar()}return r.id}
async function guardarClase(i){await guardar(i)}
async function borrarClase(i){const c=D.clases[i];if(!c.id){D.clases.splice(i,1);pintar();return}if(conf!==c.id){conf=c.id;pintar();return}conf="";await acc("admin_clase_borrar",{id:c.id});await cargar();msg="Clase eliminada.";pintar()}
async function cerrarCupo(i,cerrar){const id=await guardar(i,true);if(!id)return;const r=await acc("admin_clase_cerrar",{id,cerrar});
if(r&&r.ok){await cargar();const c=D.clases.find(x=>x.id===id)||{};
msg=cerrar?(!REAL?"✓ Cupo cerrado. En la demostración no se envían correos.":r.enviados?`✓ Cupo cerrado. Enlace enviado a ${r.enviados} inscritos.`:"✓ Cupo cerrado. Pega el enlace y guarda: se enviará a los inscritos."):("✓ Inscripciones reabiertas."+(c.cerrada?" Ojo: sigue sin lugares libres; sube el cupo para abrir lugares.":""))}else msg="No se pudo cambiar el estado. "+motivo(r);pintar()}
async function copiar(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok}catch(x){return false}}}
async function copiarMsj(i){const g=x=>document.getElementById(x+i).value.trim(),n=g("cn")||CURSOS[g("cs")]||"",w=g("cw"),u=g("cu");
if(!u){msg="Primero escribe el enlace de la clase.";pintar();return}
const ok=await copiar(`Hola 👋 Te comparto el enlace de tu clase "${n}" (${w}):\n${u}\n\nEntra unos minutos antes. ¡Te esperamos!`);msg=ok?"✓ Mensaje copiado. Pégalo en WhatsApp o en un correo.":"No se pudo copiar. Copia el enlace manualmente.";pintar()}
async function enviarEnlace(i){const id=await guardar(i,true);if(!id)return;const r=await acc("admin_enviar_enlace",{id});msg=r&&r.ok?(r.demo?"En la demostración no se envían correos.":`✓ Enlace reenviado a ${r.enviados} de ${r.total} inscritos.`):"No se pudo enviar. "+(r&&r.error==="sin enlace"?"Primero guarda el enlace de la clase.":motivo(r));pintar()}
function csv(){const qq=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[["nombre","correo","registro","cursos_inscritos","avance","clases_en_vivo","dudas","guias"],...D.users.map(u=>[u.n,u.e,u.f,(u.ins||[]).map(i=>(CURSOS[i.c]||i.c)+" ("+i.estado+")").join(" | "),avanceDe(u).map(a=>(CURSOS[a.k]||a.k)+" "+a.pct+"%").join(" | "),(u.r||[]).map(id=>(D.clases.find(c=>c.id===id)||{}).n).filter(Boolean).join(" | "),(u.d||[]).length,(u.g||[]).join(" ")])],a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(qq).join(",")).join("\n")],{type:"text/csv"}));a.download="alumnos-sin-prisas-tech.csv";a.click()}
if(!REAL&&window.addEventListener)window.addEventListener("storage",ev=>{if(ev.key==="spt"&&K)cargar().then(ok=>ok&&pintar())});
if(K)cargar().then(ok=>ok?pintar():entrar());else entrar();
</script>
