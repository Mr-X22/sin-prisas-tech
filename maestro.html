<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<title>Panel del maestro · Sin Prisas Tech</title>
<style>
:root{--ink:#12283d;--muted:#46596b;--blue:#b84708;--onblue:#fff;--blue2:#fdf0e1;--cream:#fffaf4;--paper:#fff;--line:#ebdac6;--green:#1f6b45;--tip:#fff3d4;--bad:#b3261e;color-scheme:light}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--ink:#f4ece4;--muted:#cdbcab;--blue:#f0954f;--onblue:#2a1203;--blue2:#2e2218;--cream:#1a1411;--paper:#251d18;--line:#41342a;--green:#7ccf9f;--tip:#3d2d10;--bad:#f2b8b5}}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.5}
main{max-width:1180px;margin:auto;padding:22px 20px 60px}
h1{font-size:28px;margin:0;letter-spacing:-.01em}.mb{display:flex;align-items:center;gap:14px}.mb img{width:64px;height:auto;background:#fff;border-radius:12px;padding:2px}.mb small{display:block;color:var(--muted)}h2{font-size:21px;margin:26px 0 8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;padding:11px 16px;font:inherit;font-weight:bold;color:var(--muted);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--muted)}.stat b{display:block;font-size:34px;color:var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
label{display:block;font-weight:bold;font-size:15px;margin-bottom:10px}
input,textarea,select{display:block;width:100%;margin-top:4px;padding:11px 12px;font:inherit;font-weight:normal;color:var(--ink);background:var(--cream);border:2px solid var(--line);border-radius:9px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.btn,.btn2,.danger,.ghost{font:inherit;font-weight:bold;border-radius:9px;padding:10px 16px;cursor:pointer}
.btn{border:0;background:var(--blue);color:var(--onblue)}.btn2{border:1px solid var(--blue);background:var(--paper);color:var(--blue)}
.danger{border:1px solid var(--bad);background:var(--paper);color:var(--bad)}.ghost{border:1px solid var(--line);background:var(--paper);color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
td .btn,td .ghost,td .danger{padding:7px 12px;font-size:.86em}td:last-child{min-width:250px}td .row{gap:6px}
.scroll{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--blue2);color:var(--ink)}
.ok{background:var(--tip);border-left:5px solid var(--green);padding:10px 14px;border-radius:7px}
.err{color:var(--bad);font-weight:bold;min-height:1.3em}
.tip{background:var(--tip);border-left:5px solid #e5a93d;padding:12px 16px;border-radius:7px;margin:12px 0}
.chip{display:inline-block;padding:2px 12px;border-radius:99px;background:var(--blue2);font-size:.82em;font-weight:700}.hint{color:var(--muted);margin:4px 0 10px;font-size:.9em}textarea{line-height:1.5}
summary{cursor:pointer;font-weight:bold;color:var(--blue)}small{color:var(--muted)}
</style>
</head>

function hoyS(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function sumM(f,m){const[y,mo,d]=f.split("-").map(Number),t=new Date(y,mo-1+m,1),u=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(Math.min(d,u)).padStart(2,"0")}

function fechaLarga(f){return new Date(f+"T00:00:00").toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}

if(n===0)estado="pendiente";else if(comp)estado=hasta>=h?"completa":"terminada";else if(hasta<h)estado="vencida";else if(difDias(h,hasta)<=7)estado="por vencer";else estado="activa";

return{id:r.id,c:r.c,mod:r.mod,meses:r.meses,total:r.mod==="unico"?UNICO[r.meses]:MENS*r.meses,pagadas:n,max,hasta,estado,acceso:n>0&&hasta>=h,proximo:comp?0:cuota,recaudado:ps.reduce((s,p)=>s+(p.monto||0),0),pagos:ps,f:r.f}}

async function rechazarComp(id,i){const nota=document.getElementById("co"+i).value.trim()||document.getElementById("cr"+i).value;const r=await acc("admin_comprobante_rechazar",{id,nota});if(r&&r.ok){await cargar();msg="Comprobante rechazado. El alumno ve el motivo"+(REAL?" y le llegó un correo.":".")}else msg="No se pudo rechazar. "+motivo(r);pintar()}
function todosPagos(){return D.ins.flatMap(i=>(i.pagos||[]).map((p,k)=>({...p,n:i.n,e:i.e,c:i.c,mod:i.mod,k,max:i.max}))).sort((a,b)=>a.f<b.f?1:a.f>b.f?-1:0)}
function libro(){const L=todosPagos();if(!L.length)return"";const mes={};L.forEach(p=>{const m=p.f.slice(0,7);mes[m]=(mes[m]||0)+p.monto});
return `<h2 style="margin-top:28px">Libro de pagos</h2><div class="row"><button class="btn2" onclick="csvPagos()">Descargar libro de pagos (CSV)</button></div><div class="grid">${Object.keys(mes).sort().reverse().slice(0,6).map(m=>`<div class="stat"><b>${dinero(mes[m])}</b>${new Date(m+"-01T00:00:00").toLocaleDateString("es-MX",{month:"long",year:"numeric"})}</div>`).join("")}</div><div class="scroll" style="margin-top:12px"><table><thead><tr><th>Fecha</th><th>Alumno</th><th>Curso</th><th>Concepto</th><th>Monto</th><th>Folio</th></tr></thead><tbody>${L.map(p=>`<tr><td>${esc(p.f)}</td><td>${esc(p.n)}<br><small>${esc(p.e)}</small></td><td>${esc(CURSOS[p.c]||p.c)}</td><td>${p.mod==="unico"?"Pago único":"Mensualidad "+(p.k+1)+" de "+p.max}${p.nota?`<br><small>${esc(p.nota)}</small>`:""}</td><td>${dinero(p.monto)}</td><td><small>${esc(p.folio||"")}</small></td></tr>`).join("")}</tbody></table></div>`}
function csvPagos(){const qq=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[["fecha","alumno","correo","curso","concepto","monto","nota","folio"],...todosPagos().map(p=>[p.f,p.n,p.e,CURSOS[p.c]||p.c,p.mod==="unico"?"Pago único":"Mensualidad "+(p.k+1)+" de "+p.max,p.monto,p.nota||"",p.folio||""])],a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(qq).join(",")).join("\n")],{type:"text/csv"}));a.download="libro-de-pagos-sin-prisas-tech.csv";a.click()}
async function pagar(id){const r=await acc("admin_pago",{id});if(r&&r.ok){await cargar();const i=D.ins.find(x=>x.id===id)||{};msg=`✓ Pago registrado. Su acceso llega hasta el ${i.hasta?fechaLarga(i.hasta):"—"}.`}else msg="No se pudo registrar el pago. "+(r&&r.error==="completo"?"Esa inscripción ya está pagada por completo.":motivo(r));pintar()}
async function deshacerPago(id){if(conf!=="d"+id){conf="d"+id;pintar();return}conf="";const r=await acc("admin_pago_deshacer",{id});await cargar();msg=r&&r.ok?"Último pago deshecho.":"No se pudo deshacer. "+motivo(r);pintar()}
async function cancelarIns(id){if(conf!=="c"+id){conf="c"+id;pintar();return}conf="";const r=await acc("admin_inscripcion_cancelar",{id});await cargar();msg=r&&r.ok?"Inscripción cancelada.":"No se pudo cancelar. "+motivo(r);pintar()}
async function responder(id,i){const t=document.getElementById("r"+i).value.trim();if(!t)return;const r=await acc("admin_responder",{id,a:t});if(r&&r.ok){await cargar();msg=REAL?"✓ Respuesta enviada. El alumno la recibe por correo y la ve en su clase.":"✓ Respuesta guardada."}else msg="No se pudo enviar la respuesta. "+motivo(r);pintar()}
function nuevaClase(){D.clases.push({id:"",n:"",cuando:"",cupo:8,url:"",curso:"",cerrada:false,res:0,ins:[]});pintar();window.scrollTo(0,document.body.scrollHeight)}
async function guardar(i,callado){const g=x=>document.getElementById(x+i).value.trim(),c={id:D.clases[i].id||"",curso:g("cs"),n:g("cn"),cuando:g("cw"),cupo:Number(g("cc"))||0,url:g("cu")};
if(!c.curso){msg="Elige el curso que se impartirá en esta clase.";pintar();return null}
if(!c.n)c.n=CURSOS[c.curso]||"Clase en vivo";
if(c.url&&!/^https?:\/\//i.test(c.url)){msg="El enlace debe empezar con https://";pintar();return null}
const r=await acc("admin_clase_guardar",{clase:c});if(!r||!r.ok){msg="No se pudo guardar. "+motivo(r);pintar();return null}
await cargar();if(!callado){msg=r.enviados?`✓ Clase guardada. El cupo ya estaba cerrado, así que se envió el enlace a ${r.enviados} inscritos.`:"✓ Clase guardada.";pintar()}return r.id}
async function guardarClase(i){await guardar(i)}
async function borrarClase(i){const c=D.clases[i];if(!c.id){D.clases.splice(i,1);pintar();return}if(conf!==c.id){conf=c.id;pintar();return}conf="";await acc("admin_clase_borrar",{id:c.id});await cargar();msg="Clase eliminada.";pintar()}
async function cerrarCupo(i,cerrar){const id=await guardar(i,true);if(!id)return;const r=await acc("admin_clase_cerrar",{id,cerrar});
if(r&&r.ok){await cargar();const c=D.clases.find(x=>x.id===id)||{};
msg=cerrar?(!REAL?"✓ Cupo cerrado. En la demostración no se envían correos.":r.enviados?`✓ Cupo cerrado. Enlace enviado a ${r.enviados} inscritos.`:"✓ Cupo cerrado. Pega el enlace y guarda: se enviará a los inscritos."):("✓ Inscripciones reabiertas."+(c.cerrada?" Ojo: sigue sin lugares libres; sube el cupo para abrir lugares.":""))}else msg="No se pudo cambiar el estado. "+motivo(r);pintar()}
async function copiar(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok}catch(x){return false}}}
async function copiarMsj(i){const g=x=>document.getElementById(x+i).value.trim(),n=g("cn")||CURSOS[g("cs")]||"",w=g("cw"),u=g("cu");
if(!u){msg="Primero escribe el enlace de la clase.";pintar();return}
const ok=await copiar(`Hola 👋 Te comparto el enlace de tu clase "${n}" (${w}):\n${u}\n\nEntra unos minutos antes. ¡Te esperamos!`);msg=ok?"✓ Mensaje copiado. Pégalo en WhatsApp o en un correo.":"No se pudo copiar. Copia el enlace manualmente.";pintar()}
async function enviarEnlace(i){const id=await guardar(i,true);if(!id)return;const r=await acc("admin_enviar_enlace",{id});msg=r&&r.ok?(r.demo?"En la demostración no se envían correos.":`✓ Enlace reenviado a ${r.enviados} de ${r.total} inscritos.`):"No se pudo enviar. "+(r&&r.error==="sin enlace"?"Primero guarda el enlace de la clase.":motivo(r));pintar()}
function csv(){const qq=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[["nombre","correo","registro","cursos_inscritos","clases_en_vivo","dudas","guias"],...D.users.map(u=>[u.n,u.e,u.f,(u.ins||[]).map(i=>(CURSOS[i.c]||i.c)+" ("+i.estado+")").join(" | "),(u.r||[]).map(id=>(D.clases.find(c=>c.id===id)||{}).n).filter(Boolean).join(" | "),(u.d||[]).length,(u.g||[]).join(" ")])],a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(qq).join(",")).join("\n")],{type:"text/csv"}));a.download="alumnos-sin-prisas-tech.csv";a.click()}
if(!REAL&&window.addEventListener)window.addEventListener("storage",ev=>{if(ev.key==="spt"&&K)cargar().then(ok=>ok&&pintar())});
if(K)cargar().then(ok=>ok?pintar():entrar());else entrar();
</script>
