<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel del maestro · Sin Prisas Tech</title>
<style>
:root{--ink:#24313a;--muted:#5d6b75;--blue:#245b8f;--onblue:#fff;--blue2:#dcebf6;--cream:#f3f1ea;--paper:#fffdf9;--line:#ded8ca;--green:#2e7d4f;--tip:#fff7df;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--ink:#e8eef2;--muted:#a5b3bd;--blue:#8ec0ee;--onblue:#10202c;--blue2:#23384a;--cream:#141b21;--paper:#1c262d;--line:#2c3a44;--green:#7bc29a;--tip:#3a3220;--bad:#f2b8b5}}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.5}
main{max-width:1180px;margin:auto;padding:22px 20px 60px}
h1{font-size:28px;margin:0}h2{font-size:21px;margin:26px 0 8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;padding:11px 16px;font:inherit;font-weight:bold;color:var(--muted);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--muted)}.stat b{display:block;font-size:34px;color:var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
label{display:block;font-weight:bold;font-size:15px;margin-bottom:10px}
input,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;font:inherit;font-weight:normal;color:var(--ink);background:var(--cream);border:2px solid var(--line);border-radius:9px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid #e5a93d;outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.btn,.btn2,.danger,.ghost{font:inherit;font-weight:bold;border-radius:9px;padding:10px 16px;cursor:pointer}
.btn{border:0;background:var(--blue);color:var(--onblue)}.btn2{border:1px solid var(--blue);background:var(--paper);color:var(--blue)}
.danger{border:1px solid var(--bad);background:var(--paper);color:var(--bad)}.ghost{border:1px solid var(--line);background:var(--paper);color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.scroll{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--blue2);color:var(--ink)}
.ok{background:var(--tip);border-left:5px solid var(--green);padding:10px 14px;border-radius:7px}
.err{color:var(--bad);font-weight:bold;min-height:1.3em}
.tip{background:var(--tip);border-left:5px solid #e5a93d;padding:12px 16px;border-radius:7px;margin:12px 0}
summary{cursor:pointer;font-weight:bold;color:var(--blue)}small{color:var(--muted)}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ▼ Pega aquí la MISMA dirección del servidor (Apps Script) que usas en index.html. Si está vacía, funciona en modo demostración.
const ENDPOINT="https://script.google.com/macros/s/AKfycbzt5zUJxAh7vLOG-COJv_bUN7za2Xm49g62jJ8Xt0NWh6jlJVF481MtPHswd9RRFX2d/exec";
const REAL=!!ENDPOINT,DEMO_KEY="1234";
const SEED=[{id:"l1",n:"Resuelve tus dudas del celular",cuando:"Martes · 6:00 p. m.",cupo:8,url:""},{id:"l2",n:"Practica el mouse y el teclado",cuando:"Jueves · 5:00 p. m.",cupo:8,url:""},{id:"l3",n:"Compartir fotos con tu familia",cuando:"Sábado · 10:00 a. m.",cupo:10,url:""}];
// Nombres que se muestran en el panel (si agregas cursos o guías en index.html, agrégalos aquí también)
const CURSOS={pc1:"Mi primera computadora",ph1:"Mi celular paso a paso",web1:"Internet sin miedo",fo1:"Mis fotografías",w1:"Word paso a paso",x1:"Excel para empezar",pp1:"PowerPoint creativo"};
const GUIAS={g1:"Word para la vida real",g2:"PowerPoint para la vida real",g3:"Excel para la vida real",g4:"Google para la vida real",g5:"Zoom: guía rápida",g6:"Redes sociales: guía rápida"};
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let K="",D={users:[],pedidos:[],clases:[]},tab="resumen",q="",msg="",conf="";
try{K=sessionStorage.getItem("mk")||""}catch(e){}

/* ---------- datos: servidor real o modo demostración ---------- */
const lsGet=()=>{try{return JSON.parse(localStorage.getItem("spt")||"{}")}catch(e){return{}}};
function lsPut(users,clases){const s=lsGet();s.users=users;s.clases=clases;try{localStorage.setItem("spt",JSON.stringify(s))}catch(e){}}
async function acc(tipo,o={}){
 if(REAL){try{const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({tipo,k:K,...o})});return await r.json()}catch(e){return null}}
 return local(tipo,o)}
function local(tipo,o){
 if(K!==DEMO_KEY)return{error:"clave"};
 const s=lsGet(),U=s.users||[],C=s.clases||SEED.map(x=>({...x})),ins=id=>U.filter(u=>(u.r||[]).includes(id));
 if(tipo==="admin_listar")return{users:U,pedidos:U.flatMap(u=>(u.g||[]).map(g=>({f:"",e:u.e,g}))),clases:C.map(c=>({...c,res:ins(c.id).length,ins:ins(c.id).map(u=>({n:u.n,e:u.e}))}))};
 if(tipo==="admin_plan"){const u=U.find(x=>x.e===o.e);if(u)u.plan=o.plan;lsPut(U,C);return{ok:1}}
 if(tipo==="admin_responder"){U.forEach(u=>(u.d||[]).forEach(d=>{if(String(d.id)===String(o.id))d.a=o.a}));lsPut(U,C);return{ok:1}}
 if(tipo==="admin_clase_guardar"){const c=o.clase,i=C.findIndex(x=>x.id===c.id);const f={id:c.id||"c"+Date.now(),n:c.n,cuando:c.cuando,cupo:Math.max(1,c.cupo||1),url:c.url};i<0?C.push(f):C[i]=f;lsPut(U,C);return{ok:1,id:f.id}}
 if(tipo==="admin_clase_borrar"){const n=C.filter(x=>x.id!==o.id);U.forEach(u=>{u.r=(u.r||[]).filter(x=>x!==o.id)});lsPut(U,n);return{ok:1}}
 if(tipo==="admin_enviar_enlace"){const c=C.find(x=>x.id===o.id);if(!c||!c.url)return{error:"sin enlace"};return{ok:1,enviados:0,total:ins(o.id).length,demo:true}}
 return{error:"tipo"}}
async function cargar(){const r=await acc("admin_listar");if(!r||r.error)return false;D={users:r.users||[],pedidos:r.pedidos||[],clases:r.clases||[]};return true}

/* ---------- entrada ---------- */
function entrar(){app.innerHTML=`<div class="card" style="max-width:480px;margin:40px auto"><h1>Panel del maestro</h1><p>Escribe tu clave para ver a tus alumnos, tus clases en vivo y sus dudas.</p><label for="k">Clave del maestro<input id="k" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')ingresar()"></label><p class="err" id="e" role="alert"></p><button class="btn" onclick="ingresar()">Entrar</button>${REAL?"":`<p><small>Modo demostración: la clave es ${DEMO_KEY}. Solo ves lo que se guardó en este mismo navegador.</small></p>`}</div>`}
async function ingresar(){K=document.getElementById("k").value;const e=document.getElementById("e");e.textContent="Un momento…";if(await cargar()){try{sessionStorage.setItem("mk",K)}catch(x){}pintar()}else{K="";e.textContent="Clave incorrecta o sin conexión."}}
function salir(){K="";try{sessionStorage.removeItem("mk")}catch(e){}entrar()}
async function recargar(){if(await cargar()){msg="✓ Datos actualizados."}else msg="No se pudo actualizar. Revisa tu internet.";pintar()}
function ir(k){tab=k;pintar()}

/* ---------- vistas ---------- */
const sinResp=()=>D.users.flatMap(u=>(u.d||[]).filter(d=>!d.a)).length;
function pintar(){const sr=sinResp(),T=[["resumen","Resumen"],["alumnos","Alumnos ("+D.users.length+")"],["clases","Clases en vivo"],["dudas","Dudas"+(sr?" ("+sr+")":"")],["pedidos","Pedidos de guías"]];
app.innerHTML=`<div class="bar"><h1>Panel del maestro</h1><div class="row" style="margin:0"><button class="ghost" onclick="recargar()">↻ Actualizar</button><button class="ghost" onclick="salir()">Salir</button></div></div><nav class="tabs">${T.map(([k,n])=>`<button class="${tab===k?"on":""}" onclick="ir('${k}')">${n}</button>`).join("")}</nav>${msg?`<p class="ok" role="status">${esc(msg)}</p>`:""}${VISTAS[tab]()}`;msg=""}
const VISTAS={
resumen(){const U=D.users,pm=U.filter(u=>u.plan==="premium").length,pre=U.filter(u=>u.aviso&&u.plan!=="premium").length;
return `<div class="grid"><div class="stat"><b>${U.length}</b>Alumnos registrados</div><div class="stat"><b>${pm}</b>Con Premium</div><div class="stat"><b>${pre}</b>Pidieron Premium</div><div class="stat"><b>${sinResp()}</b>Dudas sin responder</div><div class="stat"><b>${D.pedidos.length}</b>Pedidos de guías</div></div><h2>Clases en vivo</h2>${D.clases.length?D.clases.map(c=>`<p>• <b>${esc(c.n)}</b> · ${esc(c.cuando)} · ${c.res} de ${c.cupo} lugares ocupados ${c.url?"· ✓ enlace listo":"· ⚠ falta el enlace"}</p>`).join(""):"<p>Todavía no hay clases.</p>"}`},
alumnos(){return `<div class="row"><input id="busq" placeholder="Buscar por nombre o correo" value="${esc(q)}" oninput="q=this.value;document.getElementById('tb').innerHTML=filas()" style="flex:1;min-width:200px;margin:0"><button class="btn2" onclick="csv()">Descargar CSV</button></div><div class="scroll"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Plan</th><th>Registro</th><th>Clases en vivo</th><th>Dudas</th><th>Guías</th><th></th></tr></thead><tbody id="tb">${filas()}</tbody></table></div>`},
clases(){return `<p>Aquí defines tus clases, los lugares disponibles y el enlace de la videollamada. Los alumnos con Premium que reserven verán el botón “Entrar a la clase”. Solo quien tiene lugar puede ver el enlace.</p><div class="tip"><b>Ojo con la duración:</b> la cuenta gratis de Zoom corta las reuniones de grupo a los 40 minutos y la de Google Meet a los 60. Si tus clases duran más, usa Meet o una cuenta de pago de Zoom.</div>${D.clases.map(claseCard).join("")}<button class="btn" onclick="nuevaClase()">+ Agregar clase</button>`},
dudas(){const Q=[];D.users.forEach(u=>(u.d||[]).forEach(d=>Q.push({u,d})));Q.sort((a,b)=>!!a.d.a-!!b.d.a);
return Q.length?Q.map(({u,d},i)=>`<div class="card"><b>${esc(u.n)}</b> <small>${esc(u.e)} · ${esc(CURSOS[d.c]||d.c)}, clase ${Number(d.l)+1} · ${esc(d.f)}</small><p>${esc(d.q)}</p>${d.a?`<p class="ok">✓ Respondida: ${esc(d.a)}</p>`:`<textarea id="r${i}" rows="2" aria-label="Tu respuesta" placeholder="Escribe tu respuesta"></textarea><div class="row"><button class="btn" onclick="responder('${esc(d.id)}',${i})">Enviar respuesta</button></div>`}</div>`).join(""):"<p>Todavía no hay dudas.</p>"},
pedidos(){const nom=e=>(D.users.find(u=>u.e===e)||{}).n||"";return D.pedidos.length?`<div class="scroll"><table><thead><tr><th>Fecha</th><th>Alumno</th><th>Correo</th><th>Guía</th><th>Versión</th></tr></thead><tbody>${[...D.pedidos].reverse().map(p=>`<tr><td>${esc(p.f||"—")}</td><td>${esc(nom(p.e))}</td><td>${esc(p.e)}</td><td>${esc(GUIAS[String(p.g).replace("-i","")]||p.g)}</td><td>${String(p.g).endsWith("-i")?"Impresa (sobre pedido)":"Digital"}</td></tr>`).join("")}</tbody></table></div><p><small>Para entregar: escribe al correo del alumno, acuerden el pago y envíale la guía.</small></p>`:"<p>Todavía no hay pedidos de guías.</p>"}
};
function filas(){const f=q.toLowerCase(),L=D.users.filter(u=>!f||(u.n+" "+u.e).toLowerCase().includes(f));
return L.map(u=>{const rs=(u.r||[]).map(id=>(D.clases.find(c=>c.id===id)||{}).n).filter(Boolean);
return `<tr><td>${esc(u.n)}</td><td>${esc(u.e)}</td><td>${u.plan==="premium"?"⭐ Premium":"Gratis"}${u.aviso&&u.plan!=="premium"?"<br><small>pidió Premium</small>":""}</td><td>${esc(u.f)}</td><td>${rs.length?esc(rs.join(", ")):"—"}</td><td>${(u.d||[]).length}</td><td>${(u.g||[]).map(g=>esc(GUIAS[g.replace("-i","")]||g)+(g.endsWith("-i")?" (impresa)":" (digital)")).join("<br>")||"—"}</td><td><button class="btn2" onclick="plan('${esc(u.e)}')">${u.plan==="premium"?"Quitar Premium":"Dar Premium"}</button></td></tr>`}).join("")||`<tr><td colspan="8">No hay alumnos que coincidan.</td></tr>`}
function claseCard(c,i){return `<div class="card"><div class="two"><label>Nombre de la clase<input id="cn${i}" value="${esc(c.n)}"></label><label>¿Cuándo?<input id="cw${i}" value="${esc(c.cuando)}" placeholder="Martes 7 de octubre · 6:00 p. m."></label></div><div class="two"><label>Lugares (cupo)<input id="cc${i}" type="number" min="1" value="${esc(c.cupo)}"></label><label>Enlace de Zoom o Meet<input id="cu${i}" value="${esc(c.url||"")}" placeholder="https://..."></label></div>
<p><b>${c.res} de ${c.cupo}</b> lugares ocupados${c.res>=c.cupo&&c.id?" · <b>clase llena</b>":""}</p>
<details><summary>Inscritos (${(c.ins||[]).length})</summary>${(c.ins||[]).map(x=>`<p>${esc(x.n)} · ${esc(x.e)}</p>`).join("")||"<p>Nadie todavía.</p>"}</details>
<div class="row"><button class="btn" onclick="guardarClase(${i})">Guardar</button><button class="btn2" onclick="copiarMsj(${i})">Copiar mensaje con el enlace</button><button class="btn2" onclick="enviarEnlace(${i})" ${c.res?"":"disabled"}>Enviar enlace por correo a los inscritos</button><button class="danger" onclick="borrarClase(${i})">${conf&&conf===c.id?"Toca otra vez para borrar":"Eliminar"}</button></div></div>`}

/* ---------- acciones ---------- */
async function plan(e){const u=D.users.find(x=>x.e===e);await acc("admin_plan",{e,plan:u.plan==="premium"?"gratis":"premium"});await cargar();pintar()}
async function responder(id,i){const t=document.getElementById("r"+i).value.trim();if(!t)return;const r=await acc("admin_responder",{id,a:t});if(r&&r.ok){await cargar();msg=REAL?"✓ Respuesta enviada. El alumno la recibe por correo y la ve en su clase.":"✓ Respuesta guardada."}else msg="No se pudo enviar la respuesta.";pintar()}
function nuevaClase(){D.clases.push({id:"",n:"",cuando:"",cupo:8,url:"",res:0,ins:[]});pintar();window.scrollTo(0,document.body.scrollHeight)}
async function guardar(i,callado){const g=x=>document.getElementById(x+i).value.trim(),c={id:D.clases[i].id||"",n:g("cn"),cuando:g("cw"),cupo:Number(g("cc"))||0,url:g("cu")};
if(!c.n){msg="Escribe el nombre de la clase.";pintar();return null}
if(c.url&&!/^https?:\/\//i.test(c.url)){msg="El enlace debe empezar con https://";pintar();return null}
const r=await acc("admin_clase_guardar",{clase:c});if(!r||!r.ok){msg="No se pudo guardar. Revisa tu internet e inténtalo de nuevo.";pintar();return null}
await cargar();if(!callado){msg="✓ Clase guardada.";pintar()}return r.id}
async function guardarClase(i){await guardar(i)}
async function borrarClase(i){const c=D.clases[i];if(!c.id){D.clases.splice(i,1);pintar();return}if(conf!==c.id){conf=c.id;pintar();return}conf="";await acc("admin_clase_borrar",{id:c.id});await cargar();msg="Clase eliminada.";pintar()}
async function copiar(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok}catch(x){return false}}}
async function copiarMsj(i){const g=x=>document.getElementById(x+i).value.trim(),n=g("cn"),w=g("cw"),u=g("cu");
if(!u){msg="Primero escribe el enlace de la clase.";pintar();return}
const ok=await copiar(`Hola 👋 Te comparto el enlace de tu clase "${n}" (${w}):\n${u}\n\nEntra unos minutos antes. ¡Te esperamos!`);msg=ok?"✓ Mensaje copiado. Pégalo en WhatsApp o en un correo.":"No se pudo copiar. Copia el enlace manualmente.";pintar()}
async function enviarEnlace(i){const id=await guardar(i,true);if(!id)return;const r=await acc("admin_enviar_enlace",{id});msg=r&&r.ok?(r.demo?"En la demostración no se envían correos.":`✓ Enlace enviado a ${r.enviados} de ${r.total} inscritos.`):"No se pudo enviar. Revisa que la clase tenga enlace e inscritos.";pintar()}
function csv(){const qq=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[["nombre","correo","plan","fecha","clases_en_vivo","dudas","guias","pidio_premium"],...D.users.map(u=>[u.n,u.e,u.plan,u.f,(u.r||[]).map(id=>(D.clases.find(c=>c.id===id)||{}).n).filter(Boolean).join(" | "),(u.d||[]).length,(u.g||[]).join(" "),u.aviso?"si":""])],a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(qq).join(",")).join("\n")],{type:"text/csv"}));a.download="alumnos-sin-prisas-tech.csv";a.click()}
if(!REAL&&window.addEventListener)window.addEventListener("storage",ev=>{if(ev.key==="spt"&&K)cargar().then(ok=>ok&&pintar())});
if(K)cargar().then(ok=>ok?pintar():entrar());else entrar();
</script>
</body>
</html>
