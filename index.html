<title>Sin Prisas Tech · Cursos y clases en línea</title>
<style>

const cambia=i.estado==="pendiente"&&m>1?`<p><button class="link" onclick="inscribir('${c.id}','${i.mod==="unico"?"pagos":"unico"}')">${i.mod==="unico"?"Prefiero pagar mes a mes":"Prefiero el pago único de "+dinero(UNICO[m])}</button></p>`:"";

return`<section class="pay" id="pagopanel"><h2>Tu inscripción</h2>${meter}<div class="cstate">${insEstado(i,true)}</div>${cambia}${comprobanteForm(i)}<p class="err" id="pmsg" role="alert"></p></section>`}
async function inscribir(cid,mod){if(!S.u)return registro();const c=courses.find(x=>x.id===cid);
if(REAL){const r=await api({tipo:"inscribir",e:S.u.e,c:cid,mod});if(!r||r.error){const m=document.getElementById("pmsg");if(m)m.textContent="No pudimos inscribirte. Revisa tu internet e inténtalo de nuevo.";return}S.u=r;save()}
else{S.u.ins=S.u.ins||[];const x=S.u.ins.find(i=>i.c===cid&&i.estado!=="cancelada"),m=c.meses===1?"unico":mod;if(x){if(!(x.pagos||[]).length)x.mod=m}else S.u.ins.push({id:"i"+Date.now(),c:cid,mod:m,meses:c.meses,pagos:[],f:hoyS()});save()}
course(cid)}

function registro(){app.innerHTML=`<div class="auth"><button class="back" onclick="home()">← Volver al inicio</button><h1>Crea tu cuenta gratis</h1><p>Solo necesitamos tu nombre y tu correo. No hay contraseñas que recordar.</p>

async function crear(){const n=document.getElementById("rn").value.trim(),e=document.getElementById("re").value.trim(),m=document.getElementById("rerr");

if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){m.textContent="Revisa tu correo. Debe verse así: nombre@correo.com";return}
if(!document.getElementById("rc").checked){m.textContent="Para crear tu cuenta, marca que leíste el aviso de privacidad.";return}
const em=e.toLowerCase();
if(REAL){m.textContent="Un momento…";const r=await api({tipo:"registro",n,e:em,acepto:true});if(!r||r.error){m.textContent="No pudimos conectarnos. Revisa tu internet e inténtalo de nuevo.";return}S.u=r}
else{const ex=S.users.find(x=>x.e===em);S.u=ex||{n,e:em,plan:"gratis",f:new Date().toISOString().slice(0,10)}}
save();hdr();
app.innerHTML=`<div class="done-box"><div class="okc">${CHECK}</div><h1>¡Listo, ${esc(S.u.n)}!</h1><p>Tu cuenta gratis ya está creada.</p><button class="primary big" onclick="seguir()">${pend?(pend[0]==="g"?"Volver a las guías":"Seguir con mi clase"):"Empezar a aprender"}</button></div>`;window.scrollTo(0,0)}

function guias(){const g=e=>guides.filter(x=>x.e===e).map(guiaCard).join("");app.innerHTML=`<button class="back" onclick="home()">← Volver al inicio</button><div class="shead"><h1>Guías</h1><p class="lead">Guías sencillas de la serie “Para la vida real”, para leer a tu ritmo. La versión digital de las guías completas cuesta $150. La impresa se hace sobre pedido y cuesta más. Las guías rápidas son gratis.</p></div><p class="err" id="gmsg" role="alert"></p>${g("casi")}<section class="section"><h2 style="margin-bottom:16px">En preparación</h2><div class="guias">${g("proceso")}</div></section><section class="section"><h2 style="margin-bottom:16px">Guías rápidas gratis</h2><div class="guias">${g("rapida")}</div></section>`;window.scrollTo(0,0)}

function avisoHTML(){return `<div class="aviso-t"><p><small>Última actualización: 3 de octubre de 2026</small></p>
<h3>¿Quién es responsable de tus datos?</h3><p>${TITULAR}, con domicilio en ${DOMICILIO}. Contacto: ${CONTACTO}.</p>

<h3>¿Dónde se guardan?</h3><p>${REAL?"En una hoja de cálculo y un correo de Google administrados por el responsable. No vendemos tus datos.":"En esta versión de demostración, tus datos se guardan únicamente en tu navegador."} Además, esta página guarda en tu navegador tu avance y tu sesión. No usa cookies de publicidad.</p>
<h3>Tus derechos</h3><p>Puedes pedir acceso a tus datos, corregirlos, cancelarlos u oponerte a que los usemos, y retirar tu consentimiento cuando quieras. Escribe a ${CONTACTO} con tu nombre, el correo con el que te registraste y lo que quieres hacer. Te responderemos en los plazos que marca la ley.</p><p>Si consideras que tus derechos no fueron respetados, puedes acudir a la Secretaría Anticorrupción y Buen Gobierno, autoridad en materia de protección de datos personales en posesión de particulares.</p>
<h3>Cambios a este aviso</h3><p>Si cambia, lo publicaremos en esta misma página.</p></div>`}

function dibujar(cv,nombre,curso){const x=cv.getContext("2d"),W=1600,H=1131,az="#245b8f",oro="#e5a93d",tx="#24313a";
const fit=(t,max,ini,f)=>{let s=ini;x.font=f.replace("{s}",s);while(x.measureText(t).width>max&&s>26){s-=2;x.font=f.replace("{s}",s)}};
x.fillStyle="#fffdf9";x.fillRect(0,0,W,H);x.strokeStyle=az;x.lineWidth=10;x.strokeRect(40,40,W-80,H-80);x.strokeStyle=oro;x.lineWidth=3;x.strokeRect(62,62,W-124,H-124);
x.textAlign="center";const lg=document.querySelector(".brand img");if(lg&&lg.complete&&lg.naturalWidth)x.drawImage(lg,W/2-75,95,150,117);
x.fillStyle=az;x.font="bold 34px Arial, sans-serif";x.fillText("SIN PRISAS TECH",W/2,258);
x.fillStyle=tx;x.font="bold 92px Georgia, serif";x.fillText("DIPLOMA",W/2,355);
x.font="30px Georgia, serif";x.fillText("Constancia de finalización de curso",W/2,400);
x.fillStyle=oro;x.fillRect(W/2-120,425,240,4);
x.fillStyle=tx;x.font="italic 36px Georgia, serif";x.fillText("¡Felicidades! Se otorga este diploma a",W/2,495);
x.fillStyle=az;fit(nombre,1200,86,"bold {s}px Georgia, serif");x.fillText(nombre,W/2,595);const hw=Math.max(450,x.measureText(nombre).width/2+30);
x.strokeStyle=tx;x.lineWidth=2;x.beginPath();x.moveTo(W/2-hw,615);x.lineTo(W/2+hw,615);x.stroke();
x.fillStyle=tx;x.font="32px Georgia, serif";x.fillText("por haber completado satisfactoriamente el curso",W/2,680);
x.fillStyle=az;fit(curso,1250,58,"bold {s}px Georgia, serif");x.fillText(curso,W/2,755);
x.fillStyle=tx;x.font="italic 30px Georgia, serif";x.fillText("Aprender sin prisas también es avanzar. ¡Sigue adelante!",W/2,825);
x.font="28px Arial, sans-serif";x.fillText("Fecha: "+new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"}),W/2,895);
x.strokeStyle=tx;x.lineWidth=2;x.beginPath();x.moveTo(W/2-220,985);x.lineTo(W/2+220,985);x.stroke();
x.font="26px Georgia, serif";x.fillText(TITULAR,W/2,1020)}
